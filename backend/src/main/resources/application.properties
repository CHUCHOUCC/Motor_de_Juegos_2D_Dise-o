spring.application.name=pixelforge
server.port=${PORT:8080}

# Dónde se guardan los proyectos: mongo (por defecto) o file (archivo data/pixelforge.dat, sin MongoDB)
pixelforge.storage=${PIXELFORGE_STORAGE:mongo}

# MongoDB local por defecto; para Atlas, define la variable de entorno MONGODB_URI
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/?serverSelectionTimeoutMS=4000}
spring.mongodb.database=pixelforge

# El frontend (frontend/index.html) se sirve desde la carpeta hermana del backend.
# En Docker/Render la variable FRONTEND_DIR apunta a la copia dentro de la imagen.
spring.web.resources.static-locations=${FRONTEND_DIR:file:../frontend/}
